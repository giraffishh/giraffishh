# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 */2 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: giraffishh
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Shanghai
          config_order: base.header, base.activity+community, base.repositories, followup, languages

          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          plugin_languages: yes
          plugin_languages_ignored: html, jupyter notebook
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Add a self-contained, icon-style technology/topic grid in the free
          # right-hand half of the large layout. This intentionally does not use
          # plugin_topics, so it is not limited by GitHub's manually-starred topics.
          extras_js: |
            const technologies = [
              ['🔥', 'PyTorch'],
              ['🤗', 'Hugging Face'],
              ['🐍', 'Python'],
              ['☕', 'Java'],
              ['🐧', 'Linux'],
              ['🌿', 'Git'],
              ['Σ', 'LaTeX'],
              ['⚙', 'Slurm'],
              ['◉', 'Conda'],
              ['T', 'Transformer'],
              ['ViT', 'Vision Transformer'],
              ['CNX', 'ConvNeXt'],
              ['CLIP', 'CLIP'],
              ['VLM', 'Vision-Language Models'],
              ['VLA', 'Vision-Language-Action'],
              ['DM', 'Diffusion Models (DDPM / DDIM)'],
              ['FM', 'Flow Matching'],
              ['LoRA', 'PEFT / LoRA'],
              ['KD', 'Knowledge Distillation'],
              ['DDP', 'Distributed Training'],
              ['OD', 'Object Detection'],
              ['MM', 'Multimodal Learning'],
              ['Rep', 'Representation Learning'],
              ['AC', 'Action Chunking'],
            ];

            const languagesHeading = [...document.querySelectorAll('h2')]
              .find(h => h.textContent.includes('Languages'));
            const languagesSection = languagesHeading?.parentElement;

            if (languagesSection) {
              const section = document.createElement('section');
              section.className = 'mastered-half';

              const heading = document.createElement('h2');
              heading.className = 'field mastered-heading';
              heading.innerHTML = '<span class="mastered-pin">📌</span>Mastered technologies and topics';
              section.appendChild(heading);

              const grid = document.createElement('div');
              grid.className = 'mastered-grid';

              for (const [icon, label] of technologies) {
                const item = document.createElement('div');
                item.className = 'mastered-item';
                item.title = label;

                const mark = document.createElement('span');
                mark.className = icon.length > 3 ? 'mastered-mark mastered-mark-small' : 'mastered-mark';
                mark.textContent = icon;
                item.appendChild(mark);

                grid.appendChild(item);
              }

              section.appendChild(grid);
              languagesSection.parentNode.insertBefore(section, languagesSection);
            }

          extras_css: |
            svg.large section.mastered-half {
              display: inline-flex;
              flex-direction: column;
              width: 474px;
              vertical-align: top;
              box-sizing: border-box;
            }
            svg.large .mastered-heading {
              margin-bottom: 8px;
            }
            svg.large .mastered-pin {
              width: 16px;
              margin: 0 8px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
            }
            svg.large .mastered-grid {
              display: grid;
              grid-template-columns: repeat(8, 1fr);
              gap: 8px;
              width: 100%;
              padding: 2px 8px 8px 8px;
              box-sizing: border-box;
            }
            svg.large .mastered-item {
              height: 42px;
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid rgba(149, 157, 165, 0.28);
              border-radius: 8px;
              background: rgba(149, 157, 165, 0.07);
              box-sizing: border-box;
            }
            svg.large .mastered-mark {
              font-size: 15px;
              line-height: 1;
              font-weight: 600;
              color: #586069;
              white-space: nowrap;
            }
            svg.large .mastered-mark-small {
              font-size: 10px;
            }
