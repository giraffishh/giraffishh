# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: giraffishh
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Shanghai
          config_order: base.header, base.activity+community, base.repositories, followup, languages

          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          plugin_languages: yes
          plugin_languages_ignored: html, jupyter notebook
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Custom half-width module. Official project/brand SVGs are fetched during
          # rendering and inlined into the final SVG, so GitHub never has to load
          # external image resources.
          extras_js: |
            const technologies = [
              ['pytorch', 'EE4C2C', 'PyTorch'],
              ['huggingface', 'FFD21E', 'Hugging Face'],
              ['python', '3776AB', 'Python'],
              ['openjdk', '8B949E', 'OpenJDK'],
              ['cplusplus', '00599C', 'C++'],
              ['linux', 'FCC624', 'Linux'],
              ['ubuntu', 'E95420', 'Ubuntu'],
              ['gnubash', '4EAA25', 'GNU Bash'],
              ['git', 'F05032', 'Git'],
              ['gitlab', 'FC6D26', 'GitLab'],
              ['latex', '008080', 'LaTeX'],
              ['anaconda', '44A833', 'Anaconda'],
              ['jupyter', 'F37626', 'Jupyter'],
              ['opencv', '5C3EE8', 'OpenCV'],
              ['scikitlearn', 'F7931E', 'scikit-learn'],
              ['numpy', '4D77CF', 'NumPy'],
              ['pandas', '150458', 'pandas'],
              ['nvidia', '76B900', 'NVIDIA'],
              ['postgresql', '4169E1', 'PostgreSQL'],
              ['docker', '2496ED', 'Docker'],
              ['nginx', '009639', 'NGINX'],
              ['caddy', '1F88C0', 'Caddy'],
              ['netlify', '00C7B7', 'Netlify'],
              ['__vscode__', '007ACC', 'VS Code'],
            ];

            const vscodePath = 'M65.566 89.4264C66.889 89.9418 68.3976 89.9087 69.7329 89.2662L87.0271 80.9446C88.8444 80.0701 90 78.231 90 76.2132V19.7872C90 17.7695 88.8444 15.9303 87.0271 15.0559L69.7329 6.73395C67.9804 5.89069 65.9295 6.09724 64.3914 7.21543C64.1716 7.37517 63.9624 7.55352 63.7659 7.75007L30.6583 37.9548L16.2372 27.0081C14.8948 25.9891 13.0171 26.0726 11.7702 27.2067L7.14495 31.4141C5.61986 32.8014 5.61811 35.2007 7.14117 36.5902L19.6476 48.0001L7.14117 59.4099C5.61811 60.7995 5.61986 63.1988 7.14495 64.5861L11.7702 68.7934C13.0171 69.9276 14.8948 70.0111 16.2372 68.9921L30.6583 58.0453L63.7659 88.2501C64.2897 88.7741 64.9046 89.1688 65.566 89.4264ZM69.0128 28.9311L43.8917 48.0001L69.0128 67.069V28.9311Z';

            const languagesHeading = [...document.querySelectorAll('h2')]
              .find(h => h.textContent.includes('Languages'));
            const languagesSection = languagesHeading?.parentElement;

            if (languagesSection) {
              const section = document.createElement('section');
              section.className = 'mastered-half';

              const heading = document.createElement('h2');
              heading.className = 'field mastered-heading';
              heading.textContent = '📌 Mastered technologies and topics';
              section.appendChild(heading);

              const grid = document.createElement('div');
              grid.className = 'mastered-grid';

              for (const [slug, color, label] of technologies) {
                try {
                  let logo;

                  if (slug === '__vscode__') {
                    const ns = 'http://www.w3.org/2000/svg';
                    logo = document.createElementNS(ns, 'svg');
                    logo.setAttribute('role', 'img');
                    logo.setAttribute('viewBox', '0 0 96 96');
                    const title = document.createElementNS(ns, 'title');
                    title.textContent = 'Visual Studio Code';
                    const path = document.createElementNS(ns, 'path');
                    path.setAttribute('d', vscodePath);
                    path.setAttribute('fill', `#${color}`);
                    logo.appendChild(title);
                    logo.appendChild(path);
                  }
                  else {
                    const response = await fetch(`https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/${slug}.svg`);
                    if (!response.ok) throw new Error(`${slug}: HTTP ${response.status}`);
                    const markup = await response.text();
                    const parsed = new DOMParser().parseFromString(markup, 'image/svg+xml').documentElement;
                    logo = document.importNode(parsed, true);
                    logo.querySelectorAll('path').forEach(path => path.setAttribute('fill', `#${color}`));
                  }

                  logo.classList.add('mastered-logo');
                  logo.setAttribute('width', '19');
                  logo.setAttribute('height', '19');

                  const item = document.createElement('div');
                  item.className = 'mastered-item';
                  item.title = label;
                  item.appendChild(logo);

                  const text = document.createElement('span');
                  text.className = 'mastered-label';
                  text.textContent = label;
                  item.appendChild(text);

                  grid.appendChild(item);
                }
                catch (error) {
                  console.error(`Failed to inline ${label} logo: ${error}`);
                }
              }

              section.appendChild(grid);
              languagesSection.parentNode.insertBefore(section, languagesSection);
            }

          extras_css: |
            svg.large section.mastered-half {
              display: inline-flex;
              flex-direction: column;
              width: 474px;
              vertical-align: top;
              box-sizing: border-box;
            }
            svg.large .mastered-heading {
              margin-bottom: 3px;
            }
            svg.large .mastered-grid {
              display: grid;
              grid-template-columns: repeat(8, 1fr);
              gap: 3px;
              width: 100%;
              padding: 1px 4px 4px 4px;
              box-sizing: border-box;
            }
            svg.large .mastered-item {
              min-width: 0;
              height: 37px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 1px;
              border: 1px solid rgba(149, 157, 165, 0.20);
              border-radius: 5px;
              background: rgba(149, 157, 165, 0.045);
              box-sizing: border-box;
            }
            svg.large .mastered-logo {
              width: 19px;
              height: 19px;
              flex: 0 0 auto;
            }
            svg.large .mastered-label {
              max-width: 50px;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
              font-size: 6.5px;
              line-height: 1;
              color: #586069;
            }
