# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: giraffishh
          template: classic
          filename: github-metrics-v2.svg
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Shanghai
          config_order: base.header, base.activity+community, base.repositories, followup, languages

          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          plugin_languages: yes
          plugin_languages_ignored: html, jupyter notebook
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Custom half-width module using canonical brand marks from Simple Icons.
          # Abstract research topics without an official logo are intentionally omitted
          # rather than represented by fake initials/emoji.
          extras_js: |
            const technologies = [
              ['pytorch', 'EE4C2C', 'PyTorch'],
              ['huggingface', 'FFD21E', 'Hugging Face'],
              ['python', '3776AB', 'Python'],
              ['openjdk', '000000', 'OpenJDK'],
              ['linux', 'FCC624', 'Linux'],
              ['git', 'F05032', 'Git'],
              ['latex', '008080', 'LaTeX'],
              ['anaconda', '44A833', 'Anaconda'],
              ['jupyter', 'F37626', 'Jupyter'],
              ['opencv', '5C3EE8', 'OpenCV'],
              ['scikitlearn', 'F7931E', 'scikit-learn'],
              ['numpy', '013243', 'NumPy'],
              ['pandas', '150458', 'pandas'],
              ['nvidia', '76B900', 'NVIDIA'],
              ['github', '181717', 'GitHub'],
              ['visualstudiocode', '007ACC', 'VS Code'],
              ['postgresql', '4169E1', 'PostgreSQL'],
              ['docker', '2496ED', 'Docker'],
            ];

            const languagesHeading = [...document.querySelectorAll('h2')]
              .find(h => h.textContent.includes('Languages'));
            const languagesSection = languagesHeading?.parentElement;

            if (languagesSection) {
              const section = document.createElement('section');
              section.className = 'mastered-half';

              const heading = document.createElement('h2');
              heading.className = 'field mastered-heading';
              heading.textContent = '📌 Mastered technologies and topics';
              section.appendChild(heading);

              const grid = document.createElement('div');
              grid.className = 'mastered-grid';

              for (const [slug, color, label] of technologies) {
                const item = document.createElement('div');
                item.className = 'mastered-item';
                item.title = label;

                const img = document.createElement('img');
                img.className = 'mastered-logo';
                img.src = `https://cdn.simpleicons.org/${slug}/${color}`;
                img.alt = label;
                item.appendChild(img);

                const text = document.createElement('span');
                text.className = 'mastered-label';
                text.textContent = label;
                item.appendChild(text);

                grid.appendChild(item);
              }

              section.appendChild(grid);
              languagesSection.parentNode.insertBefore(section, languagesSection);
            }

          extras_css: |
            svg.large section.mastered-half {
              display: inline-flex;
              flex-direction: column;
              width: 474px;
              vertical-align: top;
              box-sizing: border-box;
            }
            svg.large .mastered-heading {
              margin-bottom: 8px;
            }
            svg.large .mastered-grid {
              display: grid;
              grid-template-columns: repeat(6, 1fr);
              gap: 7px;
              width: 100%;
              padding: 2px 8px 8px 8px;
              box-sizing: border-box;
            }
            svg.large .mastered-item {
              min-width: 0;
              height: 54px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              border: 1px solid rgba(149, 157, 165, 0.24);
              border-radius: 8px;
              background: rgba(149, 157, 165, 0.06);
              box-sizing: border-box;
            }
            svg.large .mastered-logo {
              width: 27px;
              height: 27px;
              object-fit: contain;
            }
            svg.large .mastered-label {
              max-width: 66px;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
              font-size: 8px;
              line-height: 1;
              color: #586069;
            }
